[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docparse"
version = "0.1.0"
description = "Unified document-to-Markdown API wrapping pdf-inspector + anydoc (MIT)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "docparse" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "pdf-inspector>=0.2.6",
    "firecrawl-anydoc>=0.1.6",
]

[project.optional-dependencies]
ocr = [
    "pypdfium2>=4.30.0",
    "rapidocr-onnxruntime>=1.4.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]
all = ["docparse[ocr,dev]"]

[project.scripts]
docparse = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
